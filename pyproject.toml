[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nightly-commerce-snapshot"
version = "0.1.0"
description = "A typed Python service that stores one deterministic e-commerce snapshot per UTC night."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.2,<9"]

[project.scripts]
commerce-snapshot = "nightly_snapshot.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nightly_snapshot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

